<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Budget - Expense Tracker</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Expense Tracker
        </div>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="expenses.html">
                Expenses
            </a>

            <a href="income.html">
                Income
            </a>

            <a href="transactions.html">
                Transactions
            </a>

            <a href="budget.html">
                Budget
            </a>

            <a href="reports.html">
                Reports
            </a>

            <a href="profile.html">
                Profile
            </a>

        </div>

    </nav>


    <main class="page-container">

        <h1>
            Monthly Budget
        </h1>


        <section class="form-card">

            <form id="budgetForm">

                <label for="budgetAmount">
                    Monthly Budget
                </label>

                <input
                    type="number"
                    id="budgetAmount"
                    min="0.01"
                    step="0.01"
                    placeholder="Enter budget amount"
                    required
                >


                <button type="submit"
                        class="btn">

                    Save Budget

                </button>

            </form>

        </section>


        <section class="budget-summary">

            <h2>
                Budget Summary
            </h2>


            <p>
                Current Month:
                <strong id="currentMonth">
                    -
                </strong>
            </p>


            <p>
                Budget:
                ₹<strong id="currentBudget">
                    0.00
                </strong>
            </p>


            <p>
                Total Spent:
                ₹<strong id="budgetSpent">
                    0.00
                </strong>
            </p>


            <p>
                Remaining:
                ₹<strong id="budgetRemaining">
                    0.00
                </strong>
            </p>


            <p id="budgetStatus">
                No budget has been set.
            </p>

        </section>

    </main>


    <script src="js/budget.js"></script>

</body>

</html>
