<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Expenses - Expense Tracker</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Expense Tracker
        </div>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="expenses.html">
                Expenses
            </a>

            <a href="income.html">
                Income
            </a>

            <a href="transactions.html">
                Transactions
            </a>

            <a href="budget.html">
                Budget
            </a>

            <a href="reports.html">
                Reports
            </a>

            <a href="profile.html">
                Profile
            </a>

        </div>

    </nav>


    <main class="page-container">

        <h1>
            Expense Management
        </h1>


        <section class="form-card">

            <h2>
                Add Expense
            </h2>


            <form id="expenseForm">

                <label for="expenseAmount">
                    Amount
                </label>

                <input
                    type="number"
                    id="expenseAmount"
                    min="0.01"
                    step="0.01"
                    placeholder="Enter amount"
                    required
                >


                <label for="expenseCategory">
                    Category
                </label>

                <select id="expenseCategory"
                        required>

                    <option value="">
                        Select Category
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Bills">
                        Bills
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                    <option value="Medical">
                        Medical
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <label for="expenseDate">
                    Date
                </label>

                <input
                    type="date"
                    id="expenseDate"
                    required
                >


                <label for="paymentMethod">
                    Payment Method
                </label>

                <select id="paymentMethod">

                    <option value="Cash">
                        Cash
                    </option>

                    <option value="UPI">
                        UPI
                    </option>

                    <option value="Debit Card">
                        Debit Card
                    </option>

                    <option value="Credit Card">
                        Credit Card
                    </option>

                    <option value="Bank Transfer">
                        Bank Transfer
                    </option>

                </select>


                <label for="expenseDescription">
                    Description
                </label>

                <textarea
                    id="expenseDescription"
                    placeholder="Enter description"
                ></textarea>


                <button type="submit"
                        class="btn">

                    Add Expense

                </button>

            </form>

        </section>


        <hr>


        <h2>
            Expense History
        </h2>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Category
                        </th>

                        <th>
                            Amount
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Payment Method
                        </th>

                        <th>
                            Description
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody id="expenseTable">

                    <tr>

                        <td colspan="6">
                            Loading...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>


    <script src="js/expenses.js"></script>

</body>

</html>
