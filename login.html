<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Expense Tracker</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/login.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Expense Tracker
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="register.html">
                Register
            </a>

        </div>

    </nav>


    <main class="auth-container">

        <div class="auth-card">

            <h1>
                Login
            </h1>

            <p>
                Login to your Expense Tracker account.
            </p>


            <form id="loginForm">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >


                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit"
                        class="btn">

                    Login

                </button>

            </form>


            <p class="auth-link">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>

        </div>

    </main>


    <script src="js/login.js"></script>

</body>

</html>
