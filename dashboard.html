<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Expense Tracker</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/dashboard.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Expense Tracker
        </div>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="expenses.html">
                Expenses
            </a>

            <a href="income.html">
                Income
            </a>

            <a href="transactions.html">
                Transactions
            </a>

            <a href="budget.html">
                Budget
            </a>

            <a href="reports.html">
                Reports
            </a>

            <a href="profile.html">
                Profile
            </a>

        </div>

    </nav>


    <main class="dashboard-container">

        <h1>
            Dashboard
        </h1>

        <div class="summary-cards">


            <div class="summary-card">

                <h3>
                    Total Income
                </h3>

                <p id="totalIncome">
                    ₹0.00
                </p>

            </div>


            <div class="summary-card">

                <h3>
                    Total Expenses
                </h3>

                <p id="totalExpenses">
                    ₹0.00
                </p>

            </div>


            <div class="summary-card">

                <h3>
                    Balance
                </h3>

                <p id="balance">
                    ₹0.00
                </p>

            </div>


        </div>

        <div class="quick-actions">

            <a href="income.html"
               class="btn">

                Add Income

            </a>

            <a href="expenses.html"
               class="btn">

                Add Expense

            </a>

            <a href="budget.html"
               class="btn">

                Set Budget

            </a>

        </div>

        <section class="recent-section">

            <h2>
                Recent Transactions
            </h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Type
                            </th>

                            <th>
                                Description
                            </th>

                            <th>
                                Amount
                            </th>

                            <th>
                                Date
                            </th>

                        </tr>

                    </thead>


                    <tbody id="recentTransactions">

                        <tr>

                            <td colspan="4">
                                Loading...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="js/dashboard.js"></script>

</body>

</html>
