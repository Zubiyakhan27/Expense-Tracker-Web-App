<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Income - Expense Tracker</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Expense Tracker
        </div>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="expenses.html">
                Expenses
            </a>

            <a href="income.html">
                Income
            </a>

            <a href="transactions.html">
                Transactions
            </a>

            <a href="budget.html">
                Budget
            </a>

            <a href="reports.html">
                Reports
            </a>

            <a href="profile.html">
                Profile
            </a>

        </div>

    </nav>


    <main class="page-container">

        <h1>
            Income Management
        </h1>


        <section class="form-card">

            <h2>
                Add Income
            </h2>


            <form id="incomeForm">

                <label for="incomeSource">
                    Income Source
                </label>

                <select id="incomeSource"
                        required>

                    <option value="">
                        Select Source
                    </option>

                    <option value="Salary">
                        Salary
                    </option>

                    <option value="Freelancing">
                        Freelancing
                    </option>

                    <option value="Business">
                        Business
                    </option>

                    <option value="Scholarship">
                        Scholarship
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <label for="incomeAmount">
                    Amount
                </label>

                <input
                    type="number"
                    id="incomeAmount"
                    min="0.01"
                    step="0.01"
                    placeholder="Enter amount"
                    required
                >


                <label for="incomeDate">
                    Date
                </label>

                <input
                    type="date"
                    id="incomeDate"
                    required
                >


                <label for="incomeDescription">
                    Description
                </label>

                <textarea
                    id="incomeDescription"
                    placeholder="Enter description"
                ></textarea>


                <button type="submit"
                        class="btn">

                    Add Income

                </button>

            </form>

        </section>


        <hr>


        <h2>
            Income History
        </h2>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Source
                        </th>

                        <th>
                            Amount
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Description
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody id="incomeTable">

                    <tr>

                        <td colspan="5">
                            Loading...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>


    <script src="js/income.js"></script>

</body>

</html>
